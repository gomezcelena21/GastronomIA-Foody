# GastronomIA - backend + PostgreSQL/PostGIS + HTTPS
#
# Uso en el servidor:
#   cp .env.produccion.example .env.produccion
#   # editar .env.produccion
#   docker compose --env-file .env.produccion up -d --build
#
# Si usás una base administrada (Neon, Supabase, etc.), poné DATABASE_URL en
# .env.produccion y ejecutá con --env-file; el servicio `db` puede quedar apagado
# con: docker compose stop db
#
# Rotación de logs: Docker guarda como máximo 10 MB x 5 archivos por servicio.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Endurecimiento común a todos los servicios: un proceso comprometido no puede
# ganar privilegios nuevos (setuid, capabilities, etc.).
x-seguridad: &seguridad
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *default-logging
    <<: *seguridad
    # Cierre ordenado de PostgreSQL para no corromper el volumen.
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastro_ia}
      POSTGRES_USER: ${POSTGRES_USER:-gastro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env.produccion}
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez que se crea el volumen.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastro} -d ${POSTGRES_DB:-gastro_ia}"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "5432"

  backend:
    build: .
    restart: unless-stopped
    logging: *default-logging
    <<: *seguridad
    # init reenvía las señales (SIGTERM) a uvicorn: el contenedor se detiene limpio.
    init: true
    # El sistema de archivos de la imagen es de solo lectura: la app no escribe
    # archivos (todo va a PostgreSQL) y así un fallo no puede dejar código nuevo.
    read_only: true
    tmpfs:
      - /tmp
    # Python y curl no necesitan ninguna capability del kernel.
    cap_drop:
      - ALL
    env_file:
      - .env.produccion
    environment:
      # Si DATABASE_URL viene en .env.produccion (Neon/Supabase) se usa esa;
      # si no, se arma la conexión al PostGIS local del compose.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-gastro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gastro_ia}}
      PORT: "8000"
      # Solo se acepta X-Forwarded-For del proxy interno (Caddy, en la subred fija
      # de abajo). Con "*" cualquiera podria inventar su IP y saltarse los cupos.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.0/16,127.0.0.1}
    # El puerto 8000 NO se publica al exterior: solo Caddy (80/443) lo alcanza,
    # por la red interna de Docker. Así nadie puede llamar al backend directo ni
    # falsear su IP para saltarse los cupos de invitados.
    # Para probar en el propio servidor o en tu PC: docker-compose.override.yml
    # lo publica solo en 127.0.0.1.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    <<: *seguridad
    # Caddy solo necesita el privilegio de abrir los puertos 80/443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio real para HTTPS automático. Sin dominio, usá:
      #   DOMINIO=TU_IP.nip.io   (HTTPS gratis con Let's Encrypt)
      # (Sin HTTPS, Vercel no puede llamar al backend: no uses http://IP.)
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
      - config_caddy:/config

  # Backups automáticos. No arranca por defecto: se activa con
  #   docker compose --env-file .env.produccion --profile backups up -d backup
  # Guarda un .sql.gz por día en ./backups y conserva los últimos 14 días.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    <<: *seguridad
    cap_drop:
      - ALL
    profiles: ["backups"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.produccion
    environment:
      PGHOST: ${PGHOST:-db}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-gastro}
      # Con DATABASE_URL (Neon/Supabase) no hace falta POSTGRES_PASSWORD.
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-gastro_ia}
      # Si DATABASE_URL está definida, backup.sh la usa y esto se ignora.
      DATABASE_URL: ${DATABASE_URL:-}
      BACKUP_DIR: /backups
      BACKUP_RETENER_DIAS: ${BACKUP_RETENER_DIAS:-14}
      BACKUP_INTERVALO: ${BACKUP_INTERVALO:-86400}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "--loop"]

volumes:
  datos_db:
  datos_caddy:
  config_caddy:

networks:
  # Subred fija y privada: el backend solo confia en X-Forwarded-For cuando el
  # pedido llega desde aca (Caddy). Si el 8000 se expusiera directo, la cabecera
  # se ignora y se usa la IP real del que llama.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
